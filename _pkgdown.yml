url: https://david-priest.github.io/GateLabR

template:
  bootstrap: 5
  bslib:
    primary: "#2f80ed"

home:
  title: GateLabR — interactive gating for SingleCellExperiment objects
  description: >
    A free, MIT-licensed Shiny app for hand-gating flow and mass cytometry
    (CyTOF) data directly on SingleCellExperiment objects.

navbar:
  structure:
    left:  [intro, articles, reference, news]
    right: [search, github]

articles:
  - title: Guides
    navbar: ~
    contents:
      - getting-started

reference:
  - title: Launching the app
    contents:
      - launchGatingApp
      - launchReactGateLab
      - gatelabStop
      - gatelabSync
  - title: Reading a saved workspace back in R
    desc: >
      "Save to SCE" stores which events every population holds, so a gating result
      can be read back without re-gating. These four read that record.
    contents:
      - gatelabHierarchies
      - gatelabHierarchy
      - gatelabPopulations
      - gatelabLeafPopulation
  - title: Drawing a gating strategy in R
    desc: >
      The gating path to chosen populations as the Strategy tab draws it, made in R
      from the saved workspace and the stored memberships. The panel, the contours
      and the event thinning it is built from can be used on their own.
    contents:
      - gatelabStrategyPlot
      - gatelabPanelGrob
      - gatelabContour
      - gatelabDisplayEvents
      - print.gatelab_strategy
  - title: Retired
    desc: >
      Kept as an exported stub so existing scripts fail with an explanation
      rather than "could not find function". It never starts an application.
    contents:
      - launchLegacyGateLabR
